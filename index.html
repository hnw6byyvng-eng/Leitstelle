<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Leitstelle.sim ist umgezogen</title>
<style>body{font-family:system-ui,sans-serif;background:#eef2f6;margin:0;display:flex;min-height:100vh;align-items:center;justify-content:center}div{background:#fff;padding:24px;border-radius:14px;max-width:420px;text-align:center}a{color:#e30613;font-weight:700}</style>
</head><body><div><h2>Leitstelle.sim ist umgezogen</h2><p>Neue Adresse: <a id="l" href="https://lst-sim.github.io/">lst-sim.github.io</a></p><p>Du wirst automatisch weitergeleitet …</p></div>
<script>
// Alte Adresse: Sitzung + Geräte-Einstellungen mitnehmen, QR-Code-Parameter (?vehicle=… usw.) erhalten.
(function(){
 var payload={};
 try{payload.cloud=JSON.parse(localStorage.getItem("dlrg-jet-cloud-shared")||"null");}catch(e){}
 try{payload.scenario=localStorage.getItem("dlrg-jet-scenario");payload.device=localStorage.getItem("dlrg-jet-device");}catch(e){}
 var url="https://lst-sim.github.io/"+location.search;
 var isTerminal=/[?&](vehicle|neighbor|caller|monitor)=/.test(location.search);
 if(!isTerminal&&payload.cloud&&payload.cloud.sessionId){
   url+="#umzug="+encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(payload)))));
 }
 document.getElementById("l").href=url;
 setTimeout(function(){location.replace(url)},800);
})();
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister()})})}</script>
</body></html>
