button.primary{background:#e30613;color:#fff;border-color:#e30613}.btn.green{background:#e9f7ef;color:#12633b}.btn.blue{background:#eaf2ff;color:#1456a0}
input,select,textarea{width:100%;border:1px solid #cbd5df;border-radius:9px;padding:11px;background:#fff;font:inherit}
label{font-size:13px;font-weight:700;color:#4b5563;display:block;margin:8px 0 5px}
.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(max-width:600px){.formgrid{grid-template-columns:1fr}}
.status{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800}
@keyframes status0blink{0%,45%{background:#d71920;color:#fff;box-shadow:0 0 0 0 rgba(215,25,32,.55)}50%,95%{background:#fff;color:#d71920;box-shadow:0 0 0 4px rgba(215,25,32,.18)}100%{background:#d71920;color:#fff}}
.s0{background:#d71920;color:#fff;animation:status0blink 1s steps(1,end) infinite;border:2px solid #d71920}.s1{background:#b9f6ca;color:#0b5d2a}.s2{background:#1f7a3f;color:#fff}.s3{background:#ffe082;color:#6b5200}.s4{background:#ffb74d;color:#6b3600}.s5{background:#fff;color:#333;border:1px solid #cbd5df}.s6{background:#e53935;color:#fff}.s7{background:#b3e5fc;color:#075985}.s8{background:#1565c0;color:#fff}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}th{font-size:12px;color:#66717d;text-transform:uppercase}

.answer{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.answer button{text-align:left;background:#f8fafc}@media(max-width:600px){.answer{grid-template-columns:1fr}}
.hidden{display:none!important}.pill{padding:4px 8px;border-radius:999px;background:#eef2f6;font-size:12px;font-weight:800}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 15px;border-radius:10px;display:none;z-index:30}

#map{height:62vh;min-height:430px;border-radius:12px;border:1px solid var(--line);overflow:hidden}

.coords{font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--muted)}

function initMap(){
  if(typeof L==="undefined"){
    document.getElementById("map").innerHTML='<div style="padding:20px">Kartenbibliothek konnte nicht geladen werden. Internetverbindung prüfen.</div>';
    return;
  }
  const c=db.currentCall;
  const lat=Number(c?.lat)||53.3965, lng=Number(c?.lng)||8.1364; // Varel
  leafletMap=L.map("map").setView([lat,lng], c?.lat?16:11);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
    maxZoom:19,
    attribution:'&copy; OpenStreetMap-Mitwirkende'
  }).addTo(leafletMap);

  if(c?.lat&&c?.lng) setIncidentMarker(Number(c.lat),Number(c.lng),false);
  renderVehiclePositionsOnMap();

  leafletMap.on("click", async e=>{
    setIncidentMarker(e.latlng.lat,e.latlng.lng,true);
    await reverseGeocode(e.latlng.lat,e.latlng.lng);
  });
  setTimeout(()=>leafletMap.invalidateSize(),150);
}

function setIncidentMarker(lat,lng,updateSelection=true){

    selectedMapLocation={lat:pos.lat,lng:pos.lng,address:""};

async function searchMap(){
  const q=document.getElementById("mapQuery").value.trim();
  if(!q)return;
  const box=document.getElementById("mapResults");
  box.innerHTML='<div class="muted">Suche …</div>';
  try{
    const url=`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&countrycodes=de&q=${encodeURIComponent(q)}`;
    const res=await fetch(url,{headers:{"Accept":"application/json"}});

    window._mapSearchResults=data;
    box.innerHTML=data.map((r,i)=>`<div class="mapResult" onclick="chooseMapResult(${i})"><b>${esc(r.display_name.split(",")[0])}</b><br><small>${esc(r.display_name)}</small></div>`).join("");

async function reverseGeocode(lat,lng){
  try{
    const url=`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}`;
    const res=await fetch(url,{headers:{"Accept":"application/json"}});
    const r=await res.json();
    const address=r.display_name||`${lat.toFixed(6)}, ${lng.toFixed(6)}`;
    selectedMapLocation={lat,lng,address};
    document.getElementById("mapAddress").value=address;
  }catch(e){
    selectedMapLocation={lat,lng,address:`${lat.toFixed(6)}, ${lng.toFixed(6)}`};
  }
}

function setUnitStatus(u,status){
 u.status=String(status);
 delete u.status1Since; delete u.status2Due;
 delete u.status7Since; delete u.status8Due;
 if(String(status)==="1"){
   u.status1Since=Date.now();
   // random return-to-station delay, always <= 10 minutes
   u.status2Due=Date.now()+Math.floor((2+Math.random()*8)*60*1000);
 } else if(String(status)==="7"){
   u.status7Since=Date.now();
   // IVENA-Zuweisung: nach ca. 20 Minuten Übergabe -> "bedingt verfügbar"
   u.status8Due=Date.now()+20*60*1000;
 }
 if(db.cloud?.enabled) setTimeout(()=>pushUnitCloud(u),0);
}

}

const OPTA_AREA_ORDER={
 "1":"Jever",
 "2":"Varel",
 "3":"Zetel",
 "4":"Sande",
 "5":"Schortens",
 "6":"Wangerland",
 "7":"Bockhorn"
};
function optaAreaDigit(u){
 const s=String(u.name||u.opta||"").replace(/[^\d]/g,"");
 // Friesland tactical IDs in this simulator use the second digit of the numeric OPTA block.
 return s.length>=2?s[1]:"9";
}
function optaAreaName(u){
 return OPTA_AREA_ORDER[optaAreaDigit(u)]||u.location||"Sonstige";
}
function geoSortUnits(arr){
 return [...arr].sort((a,b)=>{
   const da=Number(optaAreaDigit(a)), db=Number(optaAreaDigit(b));
   if(da!==db)return da-db;
   return String(a.name).localeCompare(String(b.name),"de",{numeric:true});
 });
}
function syncLocationFromOpta(){
 db.units.forEach(u=>{
   if(["Feuerwehr","Rettungsdienst"].includes(u.org)){
     const area=OPTA_AREA_ORDER[optaAreaDigit(u)];
     if(area)u.location=area;
   }
 });
}


const AREA_CENTERS={
 "Jever":[53.5737,7.8996],
 "Varel":[53.3969,8.1362],
 "Zetel":[53.4167,7.9833],
 "Sande":[53.5044,8.0147],
 "Schortens":[53.5333,7.9500],
 "Wangerland":[53.6570,7.9200],
 "Bockhorn":[53.3970,8.0200]
};
function haversine(lat1,lon1,lat2,lon2){
 const R=6371,toRad=x=>x*Math.PI/180;
 const dLat=toRad(lat2-lat1),dLon=toRad(lon2-lon1);
 const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
 return 2*R*Math.asin(Math.sqrt(a));
}
function incidentPoint(){
 const c=db.currentCall||{};
 const lat=Number(c.lat??c.latitude), lon=Number(c.lng??c.lon??c.longitude);
 if(Number.isFinite(lat)&&Number.isFinite(lon))return [lat,lon];
 const txt=((c.location||"")+" "+(c.geocodedAddress||"")+" "+(c.answers?.location||"")).toLowerCase();
 for(const [area,pt] of Object.entries(AREA_CENTERS)){
   if(txt.includes(area.toLowerCase()))return pt;
 }
 return null;
}
function incidentArea(){
 const p=incidentPoint();
 if(!p)return null;
 return Object.entries(AREA_CENTERS).sort((a,b)=>
   haversine(p[0],p[1],a[1][0],a[1][1])-haversine(p[0],p[1],b[1][0],b[1][1])
 )[0][0];
}
function unitPoint(u){
 if(Number.isFinite(Number(u.lat)) && Number.isFinite(Number(u.lng)))return [Number(u.lat),Number(u.lng)];
 const a=optaAreaName(u);
 if(AREA_CENTERS[a])return AREA_CENTERS[a];
 const loc=String(u.location||"").toLowerCase();
 for(const [area,pt] of Object.entries(AREA_CENTERS))
   if(loc.includes(area.toLowerCase()))return pt;
 return null;
}
function geographicRank(u){
 const target=incidentPoint(), home=unitPoint(u);
 if(target&&home)return haversine(target[0],target[1],home[0],home[1]);
 const area=incidentArea();
 if(area&&optaAreaName(u)===area)return 0;
 return 999;
}
function nearestFirst(arr){
 return [...arr].sort((a,b)=>{
   const ga=geographicRank(a),gb=geographicRank(b);
   if(ga!==gb)return ga-gb;
   // status 1/2 preference remains, but geography wins first
   const sa=a.status==="1"?0:a.status==="2"?1:2;
   const sb=b.status==="1"?0:b.status==="2"?1:2;
   if(sa!==sb)return sa-sb;
   return String(a.name).localeCompare(String(b.name),"de",{numeric:true});
 });
}

function availableUnits(type,org=null){
 const prim=nearestFirst(db.units.filter(u=>(!type||u.type===type)&&(!org||u.org===org)&&["1","2"].includes(u.status)));
 if(prim.length)return prim;
 return nearestFirst(db.units.filter(u=>(!type||u.type===type)&&(!org||u.org===org)&&u.status==="8"));
}
function chooseOne(type,org=null){return availableUnits(type,org)[0]||null}


function realisticMode(){
  applyDutySchedule();
  const candidates=db.units.filter(u=>["Feuerwehr","Rettungsdienst"].includes(u.org) && !u.schedule && !["0","3","4","5","6","7"].includes(u.status));
  // reset eligible units to plausible base state first
  candidates.forEach(u=>setUnitStatus(u,u.org==="Feuerwehr"?"2":"1"));
  // random subset gets realistic non-free states
  const shuffled=[...candidates].sort(()=>Math.random()-.5);
  const n=Math.max(3,Math.min(10,Math.floor(shuffled.length*0.18)));
  shuffled.slice(0,n).forEach((u,i)=>{
    const wanted=u.org==="Feuerwehr"?["3","4","6"]:["3","4","6","8"];
    const allowed=wanted.filter(s=>statusOptionsFor(u).includes(s));
    if(!allowed.length)return;
    setUnitStatus(u,allowed[i%allowed.length]);
  });
  // air rescue can also be occasionally unavailable/mission-bound, but keep less frequent
  const c26=db.units.find(u=>u.name==="Christoph 26");
  if(c26 && Math.random()<0.35) setUnitStatus(c26,Math.random()<0.7?"3":"8");
  save(); toast("Realistischer Statusmix gesetzt"); render("mittel");
}

   reason=(document.getElementById("nafoReason")?.value||"").trim();

   c.pendingNafoReason=reason;
 }

 appendUnitToCall(c,u,isNafo?"Nachforderung":"zusätzlich");

 if(c.alarmTime || isNafo){
   setUnitStatus(u,"3");
   c.alarmedUnits=c.alarmedUnits||[];
   if(!c.alarmedUnits.some(id=>String(id)===String(u.id)))c.alarmedUnits.push(u.id);
 }

 if(isNafo){
   const text=buildMeldertext(c,reason)+`\nNachgefordertes Rettungsmittel: ${unitLabel(u)}`;
   c.nafo=c.nafo||[];
   c.nafo.push({time:now.toISOString(),reason,unitId:u.id,type:u.type,text});

   showNafo(text);
   return;
 }

 c.history.push({
   q:c.alarmTime?"➕ Zusätzliches Rettungsmittel alarmiert":"➕ Zum Alarmvorschlag ergänzt",
   a:unitLabel(u)
 });
 save();
 if(db.cloud?.enabled)setTimeout(()=>pushCallCloud(c),0);
 toast(c.alarmTime?`${u.opta||u.name} zusätzlich alarmiert`:`${u.opta||u.name} zum Vorschlag ergänzt`);
 showResourcePicker("additional");
}

async function geocodeIncidentAddress(address){
 if(!address || address.trim().length<3)return false;
 try{
   const q=encodeURIComponent(address.includes("Friesland")?address:`${address}, Landkreis Friesland, Niedersachsen, Deutschland`);
   const res=await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=de&q=${q}`,{headers:{"Accept":"application/json"}});
   const rows=await res.json();
   if(rows&&rows[0]){
     const c=db.currentCall;
     c.lat=Number(rows[0].lat); c.lng=Number(rows[0].lon);
     c.geocodedAddress=rows[0].display_name||address;
     return true;
   }
 }catch(e){}
 return false;
}

   c.location=v;
   if(notrufSelected){
     c.lat=notrufSelected.lat; c.lng=notrufSelected.lng; c.geocodedAddress=v;
     notrufSelected=null;
   }else{
     await geocodeIncidentAddress(v);
   }
 }
 if(k==="count")c.count=v;
 const q=qs.find(x=>x[0]===k);
 c.history.push({q:q?q[1]:k,a:v});
 evaluate();
 save();
 notruf();
}
function evaluate(){
 applyDutySchedule();
 const c=db.currentCall, a=c.answers, e=a.event||"";
 let req=[], keyword="Noch unklar", sr=true;

 const add=(type,n=1,org=null)=>{for(let i=0;i<n;i++)req.push({type,org})};

 if(e==="Reanimation" || (a.conscious==="nein" && a.breathing==="nein")){
   keyword="REANIMATION R1N1";
   add("RTW",1,"Rettungsdienst"); add("NEF",1,"Rettungsdienst");
   const nktw=availableUnits("NKTW","Rettungsdienst")[0];
   if(nktw) req.push({exact:nktw.id,type:"NKTW",org:"Rettungsdienst",firstResponder:true});
 } else if(e==="Person im Wasser"){
   keyword="H_Person im Wasser R1";
   add("GW Wasserrettung",1,"DLRG"); add("MTW",1,"DLRG"); add("GW Drohne",1,"DLRG");
   add("HLF",1,"Feuerwehr"); add("RTW",1,"Rettungsdienst"); add("FuStW",1,"Polizei");
 } else if(e==="Tier im Wasser"){
   keyword="H_Tier im Wasser R1";
   add("GW Wasserrettung",1,"DLRG"); add("MTW",1,"DLRG"); add("GW Drohne",1,"DLRG");
   add("HLF",1,"Feuerwehr"); add("RTW",1,"Rettungsdienst"); add("FuStW",1,"Polizei");
 } else if(e==="Boot in Notlage"){
   const cnt=Number(a.count)||1;
   keyword=cnt>=2?"H_Boot YY R1":"H_Boot Y R1";
   add("GW Wasserrettung",1,"DLRG"); add("MTW",1,"DLRG"); add("GW Drohne",1,"DLRG");
   add("HLF",1,"Feuerwehr"); add("RTW",Math.max(1,Math.min(cnt,3)),"Rettungsdienst"); add("FuStW",1,"Polizei");
 } else if(e==="Feuer / Rauchentwicklung"){
   keyword=a.firePeople==="ja"?"F_2_Y":"F_2";
   add("HLF",1,"Feuerwehr"); add("LF",1,"Feuerwehr");
   if(a.firePeople==="ja"){add("DLK",1,"Feuerwehr");add("RTW",1,"Rettungsdienst")}
 } else if(e==="Verkehrsunfall"){
   keyword=a.trapped==="ja"?"H_Eingeklemmt_2 R1":"H_VU R1";
   add("HLF",1,"Feuerwehr"); add("RTW",1,"Rettungsdienst");
   if(a.trapped==="ja")add("RW",1,"Feuerwehr");
 } else if(e==="Technische Hilfeleistung"){
   keyword="TH";
   add("HLF",1,"Feuerwehr");
 } else if(e==="Medizinischer Notfall"){
   keyword="MEDIZINISCHER NOTFALL R1";
   add("RTW",1,"Rettungsdienst");
 } else if(e==="Sonstiger Notfall"){
   keyword="NOTFALL – Disponentenentscheidung";
   sr=false;
 }

 // XABCDE-Ergebnis kann den Rettungsdienst-Anteil der Alarmierung verschärfen und
 // liefert ein eigenes, spezifischeres Meldestichwort – unabhängig vom Grundereignis
 // (Wasser, VU, Feuer mit Personengefährdung, …), sofern XABCDE erhoben wurde.
 if(needsXABCDE(c)){
   let xLabel=null;
   if(a.x_massive==="Ja"){
     add("RTW",1,"Rettungsdienst"); add("NEF",1,"Rettungsdienst");
     xLabel="RD_X – Kritische Blutung (Schockraum voranmelden)";
   } else if(a.b_breath==="Keine normale Atmung"){
     add("RTW",1,"Rettungsdienst"); add("NEF",1,"Rettungsdienst");
     xLabel="RD_B – Atemstillstand / reanimationspflichtig";
   } else if(a.c_circ==="Relevante Blutung"){
     add("RTW",1,"Rettungsdienst"); add("NEF",1,"Rettungsdienst");
     xLabel="RD_C – Relevante Blutung (Schockraum voranmelden)";
   } else if(a.c_circ==="Auffällig / Schockzeichen"){
     add("NEF",1,"Rettungsdienst");
     xLabel="RD_C – Schockzeichen";
   } else if(a.a_airway==="Gefährdet / verlegt"){
     add("NEF",1,"Rettungsdienst");
     xLabel="RD_A – Atemweg gefährdet";
   } else if(a.d_disability==="Bewusstlos"){
     add("NEF",1,"Rettungsdienst");
     xLabel="RD_D – Bewusstlos";
   } else if(a.d_disability==="Krampfanfall / neurologisch auffällig"){
     add("NEF",1,"Rettungsdienst");
     xLabel="RD_D – Krampfanfall";
   } else if(a.b_breath==="Auffällig"){
     xLabel="RD_B – Atmung auffällig";
   } else if(a.d_disability==="Bewusstseinsgetrübt"){
     xLabel="RD_D – Bewusstsein getrübt";
   }
   if(xLabel) keyword=`${keyword} · ${xLabel}`;
 }

 const cnt=Number(a.count)||0;
 if(cnt>3){
   add("RTW",Math.max(1,Math.ceil(cnt/3)),"Rettungsdienst");
   add("NEF",1,"Rettungsdienst");
   add("OrgL/LNA",1,"Rettungsdienst");
   add("ELW",1,"Feuerwehr");
   keyword=`MANV – ${keyword} – ${cnt} Verletzte`;
 }

 let selected=[], used=new Set();
 for(const r of req){
   let u=null;
   if(r.exact)u=db.units.find(x=>x.id===r.exact);
   else {
     let arr=availableUnits(r.type,r.org).filter(x=>!used.has(x.id));
     u=arr[0]||null;
   }
   if(u){selected.push({...u,firstResponder:!!r.firstResponder});used.add(u.id)}
   else selected.push({missing:true,type:r.type,org:r.org});
 }
 c.keyword=keyword;
 c.proposedUnitIds=selected.filter(x=>!x.missing).map(x=>x.id);
 c.proposal=selected;
 c.suggestion=selected.map(x=>x.missing?`⚠️ ${x.type} (${x.org||"beliebig"}) nicht verfügbar`:`${x.opta||x.name} – ${x.type}${x.firstResponder?" (First Responder)":""}${Number.isFinite(geographicRank(x))&&geographicRank(x)<999?` (~${geographicRank(x).toFixed(1)} km Luftlinie)`:``}`).join(" · ");
 c.sr=sr;
}

function buildMeldertext(c, nafoReason=""){
  const ort=c.location||c.answers?.location||"Ort unbekannt";
  const lage=c.answers?.event||c.keyword||"Einsatz";
  const mittel=(c.suggestion||"").replace(/<[^>]*>/g,"");
  let txt=`${c.keyword||"EINSATZ"}\nOrt: ${ort}\nMeldung: ${lage}`;
  if(needsXABCDE(c)){
    txt+=`\nXABCDE: X ${c.answers.x_massive}; A ${c.answers.a_airway}; B ${c.answers.b_breath}; C ${c.answers.c_circ}; D ${c.answers.d_disability}; E ${c.answers.e_exposure}`;
  }
  if(c.alarmFreeText)txt+=`\nAlarmierungs-Freitext: ${c.alarmFreeText}`;
  if(mittel) txt+=`\nWeitere Rettungsmittel: ${mittel}`;
  txt+=`\nAnfahrt: entsprechend AAO`;
  if(nafoReason) txt+=`\nNAFO-Grund: ${nafoReason}`;
  return txt;
}

function alarmProposal(){

 if(!c||!c.proposedUnitIds||!c.proposedUnitIds.length){toast("Kein alarmierbarer Vorschlag vorhanden");return}
 if(needsXABCDE(c)&&!xabcdeComplete(c)){
   toast("XABCDE ist noch nicht vollständig");
   render("notruf");
   return;
 }
 const now=new Date();
 c.alarmedUnits=c.alarmedUnits||[];
 for(const id of c.proposedUnitIds){
   const u=db.units.find(x=>x.id===id);
   if(!u)continue;
   setUnitStatus(u,"3");
   if(!c.alarmedUnits.includes(id))c.alarmedUnits.push(id);
 }
 c.alarmTime=now.toISOString();
 c.history.push({q:"🚨 Alarmierung",a:`Vorschlag alarmiert – ${now.toLocaleTimeString("de-DE")}${c.alarmFreeText?` | Freitext: ${c.alarmFreeText}`:""}`});
 save();
 if(db.cloud?.enabled)setTimeout(()=>pushCallCloud(c),0);

 render("leitstelle");
}

function finishCall(id=null){
 const targetId=String(id ?? db.currentCall?.id ?? "");
 let c=null, source="";
 if(db.currentCall && String(db.currentCall.id)===targetId){c=db.currentCall;source="current";}
 else{
   const i=(db.activeCalls||[]).findIndex(x=>String(x.id)===targetId);
   if(i>=0){c=db.activeCalls[i];source="active";}
 }
 if(!c){toast("Einsatz nicht gefunden");return}

 const ids=new Set([...(c.alarmedUnits||[]),...(c.proposedUnitIds||[])]);
 ids.forEach(uid=>{
   const u=db.units.find(x=>String(x.id)===String(uid));
   if(u)setUnitStatus(u,"1");
 });
 c.endTime=new Date().toISOString();
 if(db.cloud?.enabled)setTimeout(()=>closeCallCloud(c),0);
 db.logs.unshift(c);

 if(source==="current")db.currentCall=null;
 else db.activeCalls=db.activeCalls.filter(x=>String(x.id)!==targetId);

 save();
 toast("Einsatz abgeschlossen – zugeordnete Mittel Status 1");
 render("leitstelle");
}

function cleanDatabaseURL(url){
 return String(url||"").trim().replace(/\/+$/,"");
}
function cloudBase(){
 const url=cleanDatabaseURL(db.cloud?.databaseURL);
 const sid=encodeURIComponent(db.cloud?.sessionId||"");
 return url&&sid?`${url}/sessions/${sid}`:"";
}
async function cloudRequest(path,method="GET",data=null){
 if(!db.cloud?.enabled || !db.cloud?.databaseURL)return null;
 const base=cloudBase(); if(!base)return null;
 const url=`${base}/${path}.json`;
 const opt={method,headers:{"Content-Type":"application/json"}};
 if(data!==null)opt.body=JSON.stringify(data);
 try{
   const r=await fetch(url,opt);
   if(!r.ok)throw new Error(`HTTP ${r.status}`);
   return await r.json();
 }catch(e){
   console.warn("Cloud sync",e);
   return null;
 }
}

  updatedAt:new Date().toISOString()
 });

async function pushCallCloud(c){
 if(!c || !db.cloud?.enabled)return;
 const unitIds=[...(c.alarmedUnits||[]),...(c.proposedUnitIds||[])].map(String);
 const units=(db.units||[]).filter(u=>unitIds.includes(String(u.id))).map(u=>({
   id:u.id,name:u.name,opta:u.opta,type:u.type,org:u.org,status:String(u.status)
 }));
 await cloudRequest(`calls/${encodeURIComponent(String(c.id))}`,"PUT",{
   id:c.id,location:c.location||"",keyword:c.keyword||"",count:c.count||"",
   suggestion:c.suggestion||"",alarmFreeText:c.alarmFreeText||"",
   alarmTime:c.alarmTime||null,endTime:c.endTime||null,
   unitIds,units,history:c.history||[],nafo:c.nafo||[],
   updatedAt:new Date().toISOString()
 });
 for(const u of units){
   await cloudRequest(`unitCalls/${encodeURIComponent(String(u.id))}/${encodeURIComponent(String(c.id))}`,"PUT",{
     callId:c.id,active:!c.endTime,updatedAt:new Date().toISOString()
   });
 }
}
async function closeCallCloud(c){

   });
 }
}

}

async function pollCloudUnits(){
 if(!db.cloud?.enabled)return;
 let changed=false;
 const remote=await cloudRequest("units");
 if(remote){
   for(const ru of Object.values(remote)){
     if(!ru||ru.id==null)continue;
     const u=db.units.find(x=>String(x.id)===String(ru.id));
     if(u && ru.status!=null && String(u.status)!==String(ru.status)){
       u.status=String(ru.status);
       delete u.status1Since; delete u.status2Due;
       delete u.status7Since; delete u.status8Due;
       if(String(ru.status)==="7"){
         u.status7Since=Date.now();
         u.status8Due=Date.now()+20*60*1000; // vom Fahrzeugterminal aus zugewiesen
       }
       changed=true;
     }
     if(u && ru.lat!=null && ru.lng!=null && (u.lat!==ru.lat || u.lng!==ru.lng)){
       u.lat=ru.lat; u.lng=ru.lng; u.gpsAccuracy=ru.gpsAccuracy; u.gpsUpdatedAt=ru.gpsUpdatedAt;
       changed=true;
     }
   }
 }
 const remoteAsg=await cloudRequest("ivenaAssignments");
 if(remoteAsg){
   db.ivenaAssignments=db.ivenaAssignments||[];
   const existingIds=new Set(db.ivenaAssignments.map(a=>String(a.id)));
   let addedAny=false;
   for(const ra of Object.values(remoteAsg)){
     if(!ra||ra.id==null||existingIds.has(String(ra.id)))continue;
     db.ivenaAssignments.unshift(ra);
     addedAny=true;
   }
   if(addedAny){changed=true; toast("📋 Neue IVENA-Zuweisung vom Fahrzeugterminal empfangen");}
 }
 const remoteFeedback=await cloudRequest("orglFeedback");
 if(remoteFeedback){
   const allCalls=[...(db.currentCall?[db.currentCall]:[]),...(db.activeCalls||[])];
   for(const fb of Object.values(remoteFeedback)){
     if(!fb||fb.id==null||!fb.callId)continue;
     const call=allCalls.find(c=>String(c.id)===String(fb.callId));
     if(!call)continue;
     call.orglFeedback=call.orglFeedback||[];
     if(!call.orglFeedback.some(x=>String(x.id)===String(fb.id))){
       call.orglFeedback.unshift(fb);
       changed=true;
     }
   }
 }
 if(changed){
   save();
   // Only auto-refresh screens that display live status, so we don't interrupt
   // someone mid-typing on the Notruf or Karte tabs.
   if(["leitstelle","mittel","ivenaZuweisungen","karte"].includes(currentPage))render(currentPage);
 }
}

function vehicleCloudURL(dburl,sid,path){
 return `${cleanDatabaseURL(dburl)}/sessions/${encodeURIComponent(sid)}/${path}.json`;
}
async function vehicleFetch(dburl,sid,path,method="GET",data=null){
 if(!dburl||!sid)return null;
 const opt={method,headers:{"Content-Type":"application/json"}};
 if(data!==null)opt.body=JSON.stringify(data);
 try{
  const r=await fetch(vehicleCloudURL(dburl,sid,path),opt);
  if(!r.ok)throw new Error(`HTTP ${r.status}`);
  return await r.json();
 }catch(e){console.warn(e);return null}
}
let vehiclePollTimer=null, vehicleIvenaCache=null, vehicleUnitsCache=null, vehicleKnownCallIds=null;
let vehicleAudioCtx=null, vehicleGeoWatchId=null, vehicleGeoLastPush=0;
function playAlarmTone(){
 try{
   if(!vehicleAudioCtx)vehicleAudioCtx=new (window.AudioContext||window.webkitAudioContext)();
   if(vehicleAudioCtx.state==="suspended")vehicleAudioCtx.resume();
   const now=vehicleAudioCtx.currentTime;
   const freqs=[970,1300]; // zweitoniger Wechselton, angelehnt an klassische Pager-/Meldeempfänger-Alarmierung (Swissphone X35 u.ä.)
   const toneLen=0.4, gap=0.05, repeats=6;
   let t=now;
   for(let i=0;i<repeats;i++){
     const osc=vehicleAudioCtx.createOscillator();
     const gain=vehicleAudioCtx.createGain();
     osc.type="square";
     osc.frequency.setValueAtTime(freqs[i%2],t);
     gain.gain.setValueAtTime(0.0001,t);
     gain.gain.exponentialRampToValueAtTime(0.25,t+0.02);
     gain.gain.setValueAtTime(0.25,t+toneLen-0.05);
     gain.gain.exponentialRampToValueAtTime(0.0001,t+toneLen);
     osc.connect(gain).connect(vehicleAudioCtx.destination);
     osc.start(t); osc.stop(t+toneLen);
     t+=toneLen+gap;
   }
 }catch(e){console.warn("Alarmton fehlgeschlagen",e)}
}
function vibrateAlarm(){
 if(navigator.vibrate)navigator.vibrate([500,200,500,200,500,200,500]);
}
function unlockVehicleAudio(){
 try{
   if(!vehicleAudioCtx)vehicleAudioCtx=new (window.AudioContext||window.webkitAudioContext)();
   if(vehicleAudioCtx.state==="suspended")vehicleAudioCtx.resume();
 }catch(e){}
 playAlarmTone();
 vibrateAlarm();
 toast("Alarmton aktiviert – bei neuem Einsatz ertönt er automatisch");
}
function toggleVehicleGeo(unitId,dburl,sid){
 if(vehicleGeoWatchId){
   navigator.geolocation.clearWatch(vehicleGeoWatchId);
   vehicleGeoWatchId=null;
   toast("Standortfreigabe beendet");
   renderVehicleTerminal(unitId,dburl,sid);
   return;
 }
 if(!navigator.geolocation){toast("Geolocation wird von diesem Browser nicht unterstützt");return}
 vehicleGeoWatchId=navigator.geolocation.watchPosition(async pos=>{
   const now=Date.now();
   if(now-vehicleGeoLastPush<5000)return;
   vehicleGeoLastPush=now;
   await vehicleFetch(dburl,sid,`units/${encodeURIComponent(unitId)}`,"PATCH",{
     lat:pos.coords.latitude, lng:pos.coords.longitude,
     gpsAccuracy:Math.round(pos.coords.accuracy||0),
     gpsUpdatedAt:new Date().toISOString()
   });
 },err=>{
   toast("Standort konnte nicht ermittelt werden: "+(err.message||"Fehler"));
 },{enableHighAccuracy:true,maximumAge:5000,timeout:15000});
 toast("Standortfreigabe aktiviert");
 renderVehicleTerminal(unitId,dburl,sid);
}
async function renderVehicleTerminal(unitId,dburl,sid){

 async function refresh(){
   if(!dburl||!sid){
     document.getElementById("vehicleLive").textContent="OFFLINE";
     document.getElementById("vehicleBody").innerHTML=`<div class="card"><h2>Keine Live-Verbindung</h2><p>Dieser QR-Code wurde ohne eingerichtete Firebase-Datenbank erzeugt.</p></div>`;
     return;
   }
   const unit=await vehicleFetch(dburl,sid,`units/${encodeURIComponent(unitId)}`);
   const refs=await vehicleFetch(dburl,sid,`unitCalls/${encodeURIComponent(unitId)}`)||{};
   const activeIds=Object.values(refs).filter(x=>x&&x.active).map(x=>String(x.callId));
   const calls=[];
   for(const id of activeIds){
     const c=await vehicleFetch(dburl,sid,`calls/${encodeURIComponent(id)}`);
     if(c)calls.push(c);
   }
   const newIds=new Set(calls.map(c=>String(c.id)));
   if(vehicleKnownCallIds!==null){
     const brandNew=[...newIds].some(id=>!vehicleKnownCallIds.has(id));
     if(brandNew){playAlarmTone();vibrateAlarm()}
   }
   vehicleKnownCallIds=newIds;
   const remoteIvena=await vehicleFetch(dburl,sid,"ivena");
   if(Array.isArray(remoteIvena))vehicleIvenaCache=remoteIvena;
   else if(remoteIvena&&typeof remoteIvena==="object")vehicleIvenaCache=Object.values(remoteIvena).filter(Boolean);
   const remoteUnits=await vehicleFetch(dburl,sid,"units");
   if(remoteUnits&&typeof remoteUnits==="object")vehicleUnitsCache=Object.values(remoteUnits).filter(Boolean);
   const live=document.getElementById("vehicleLive");
   if(live){live.textContent="LIVE";live.className="status s2"}
   const body=document.getElementById("vehicleBody"); if(!body)return;
   const vType=unit?.type||local?.type;
   const inCallStatus4=String(unit?.status)==="4" && calls.length>0;
   const canAssign=String(unit?.status)==="4" && ["RTW","RTH","OrgL/LNA","NEF"].includes(vType);
   const canOrglFeedback=vType==="OrgL/LNA" && inCallStatus4;
   body.innerHTML=`${vehicleGeoWatchId?`<div class="pill" style="margin-bottom:8px">📍 Standort wird live übertragen</div>`:""}<div class="card"><div class="row between"><div><b>Status</b><div class="big">${unit?statusName(String(unit.status)):"—"}</div></div><span class="status ${unit?statusClass(String(unit.status)):"s6"}">${unit?String(unit.status):"?"}</span></div>
    <div class="answer" style="margin-top:12px">
      ${statusOptionsFor(local).filter(s=>s!=="0").map(s=>`<button onclick="vehicleSetStatus('${unitId}','${s}','${dburl.replace(/'/g,"\\'")}','${sid.replace(/'/g,"\\'")}')">${s}<small style="display:block">${statusName(s)}</small></button>`).join("")}
    </div>
    ${canAssign?`<div class="row" style="margin-top:12px"><button class="primary" onclick="openVehicleIvenaAssignment('${unitId}','${dburl.replace(/'/g,"\\'")}','${sid.replace(/'/g,"\\'")}')">🏥 IVENA-${["OrgL/LNA","NEF"].includes(vType)?"Anmeldung":"Zuweisung"}</button></div>`:""}
    ${inCallStatus4?`<div class="row" style="margin-top:12px"><button onclick="sendVehicleFeedback('${unitId}','${dburl.replace(/'/g,"\\'")}','${sid.replace(/'/g,"\\'")}','${esc(String(calls[0].id))}','nafo')">📟 Nachfordern</button></div>`:""}
    ${canOrglFeedback?`<div class="row" style="margin-top:12px"><button class="primary" onclick="sendOrglSituationReport('${unitId}','${dburl.replace(/'/g,"\\'")}','${sid.replace(/'/g,"\\'")}','${esc(String(calls[0].id))}')">📢 Lagemeldung (Status 4) senden</button></div>`:""}
    </div>
    ${calls.length?calls.map(c=>`<div class="card call">
       <div class="row between"><h2>🚨 ${esc(c.keyword||"Einsatz")}</h2><span class="status s3">ALARM</span></div>
       <div class="big">📍 ${esc(c.location||"Ort unbekannt")}</div>
       ${c.alarmFreeText?`<div class="suggest"><b>Meldetext / Zusatz:</b><div>${esc(c.alarmFreeText)}</div></div>`:""}
       <div class="suggest"><b>Alarmierte Mittel</b><div>${esc(c.suggestion||"—")}</div></div>
       ${Array.isArray(c.nafo)&&c.nafo.length?`<div class="card" style="background:#fff7ed"><b>📟 Nachforderung / Lageänderung</b>${c.nafo.slice(-3).map(n=>`<div>${esc(n.reason||"")}</div>`).join("")}</div>`:""}
     </div>`).join(""):`<div class="card"><h2>Kein aktueller Einsatz</h2><p class="muted">Dieses Fahrzeug sieht nur Einsätze, denen es zugeordnet wurde.</p></div>`}
    ${vehicleIvenaCache?renderIvenaMini(vehicleIvenaCache):""}`;
 }
 await refresh();
 clearInterval(vehiclePollTimer);
 vehiclePollTimer=setInterval(refresh,2000);
}

async function sendOrglSituationReport(unitId,dburl,sid,callId){
 const local=db.units.find(x=>String(x.id)===String(unitId));
 const unitLabel=local?.opta||local?.name||unitId;
 const patientsRaw=prompt("Anzahl der Patienten am Einsatzort:");
 if(patientsRaw===null)return;
 const patients=parseInt(patientsRaw,10);
 if(isNaN(patients)||patients<0){toast("Bitte eine gültige Zahl eingeben");return}
 const noteText=(prompt("Zusätzliche Lagemeldung (optional):")||"").trim();
 const call=await vehicleFetch(dburl,sid,`calls/${encodeURIComponent(callId)}`);
 const rtwCount=(call?.units||[]).filter(u=>u.type==="RTW").length;
 const diff=patients-rtwCount;
 await pushFeedbackEntry(dburl,sid,{
   callId,unitId,unitLabel,kind:"lage",
   text:`${patients} Patient(en) vor Ort${noteText?` – ${noteText}`:""} (${rtwCount} RTW alarmiert)`
 });
 if(diff>0){
   await pushFeedbackEntry(dburl,sid,{
     callId,unitId,unitLabel,kind:"nafo",
     text:`Automatisch: ${diff} weitere${diff===1?"s":""} RTW nachfordern (${patients} Patienten, ${rtwCount} RTW alarmiert)`
   });
 }else if(diff<0){
   const surplus=-diff;
   await pushFeedbackEntry(dburl,sid,{
     callId,unitId,unitLabel,kind:"abbestellen",
     text:`Automatisch: ${surplus} RTW können abbestellt werden (${patients} Patienten, ${rtwCount} RTW alarmiert)`
   });
 }
 toast("Lagemeldung gesendet");
}

async function saveVehicleIvenaAssignment(unitId,dburl,sid){
 const local=db.units.find(x=>String(x.id)===String(unitId));
 const isAnnounceType=["OrgL/LNA","NEF"].includes(local?.type);
 const hospital=((vehicleIvenaCache&&vehicleIvenaCache.length)?vehicleIvenaCache:(db.ivena||[])).find(h=>String(h.id)===String(document.getElementById("vAsgHospital")?.value));
 if(!hospital){toast("Bitte Zielklinik wählen");return}
 const fach=document.getElementById("vAsgFach")?.value;
 const schockraum=document.getElementById("vAsgSchock")?.value==="ja";
 const geschlecht=document.getElementById("vAsgGender")?.value;
 const alter=document.getElementById("vAsgAlter")?.value;
 const na=document.getElementById("vAsgNA")?.value==="ja";
 const etaRaw=document.getElementById("vAsgEta")?.value;
 let vehicleIds=[unitId];
 let vehicleLabels=[`${local?.opta||local?.name||unitId} (${local?.type||"?"})`];
 if(isAnnounceType){
   const transportVal=document.getElementById("vAsgTransport")?.value;
   if(transportVal==="self"){
     await vehicleFetch(dburl,sid,`units/${encodeURIComponent(unitId)}`,"PATCH",{status:"7",updatedAt:new Date().toISOString()});
   }else if(transportVal){
     const t=(vehicleUnitsCache||[]).find(u=>String(u.id)===String(transportVal));
     vehicleIds=[transportVal];
     vehicleLabels=[`${t?.opta||t?.name||transportVal} (${t?.type||"?"})`];
     await vehicleFetch(dburl,sid,`units/${encodeURIComponent(String(transportVal))}`,"PATCH",{status:"7",updatedAt:new Date().toISOString()});
   }else{
     vehicleIds=[];
     vehicleLabels=[`Angemeldet von ${local?.opta||local?.name||unitId} (${local?.type||"?"})`];
   }
 }else{
   await vehicleFetch(dburl,sid,`units/${encodeURIComponent(unitId)}`,"PATCH",{status:"7",updatedAt:new Date().toISOString()});
 }
 const assignment={
   id:Date.now(),
   hospitalId:hospital.id, hospitalName:hospital.name,
   fach, schockraum, geschlecht, alter, na,
   vehicleIds, vehicleLabels,
   eta: etaRaw?new Date(etaRaw).toISOString():null,
   createdAt:new Date().toISOString(),
   source:"vehicle"
 };
 await vehicleFetch(dburl,sid,`ivenaAssignments/${encodeURIComponent(String(assignment.id))}`,"PUT",assignment);

 renderVehicleTerminal(unitId,dburl,sid);
}

 </div>

 <table><thead><tr><th>Stichwort</th><th>Regeln</th><th>Alarmierung</th><th></th></tr></thead><tbody>${db.aao.map(a=>`<tr><td><b>${esc(a.name)}</b></td><td>${Object.entries(a.rules).map(([k,v])=>`${k}=${v}`).join(" · ")}</td><td>${a.units.map(x=>x.n+"× "+x.type).join(", ")}</td><td><button onclick="deleteAAO(${a.id})">Löschen</button></td></tr>`).join("")}</tbody></table></div>`;
}
function addAAO(){const name=prompt("Name des Einsatzstichworts");if(!name)return;const water=prompt("Bedingung Wasser? (ja/nein/leer)","ja");const conscious=prompt("Bedingung Bewusstsein? (ja/nein/leer)","");const breathing=prompt("Bedingung Atmung? (ja/nein/leer)","");const types=prompt("Alarmierung, z.B. RTB:1,WR-Trupp:1,RTW:1","RTB:1,WR-Trupp:1");let rules={};if(water)rules.water=water;if(conscious)rules.conscious=conscious;if(breathing)rules.breathing=breathing;let units=types.split(",").map(s=>{let [type,n]=s.trim().split(":");return{type,n:Number(n)||1}});db.aao.push({id:Date.now(),name,rules,units});save();render("aao")}
function deleteAAO(id){if(confirm("AAO wirklich löschen?")){db.aao=db.aao.filter(x=>x.id!==id);save();render("aao")}}

function ivenaStatusClass(s){return s==="grün"?"s2":s==="gelb"?"s3":"s6"}
function setIvenaStatus(id,status){
 const h=db.ivena.find(x=>String(x.id)===String(id));if(!h)return;
 h.status=status;save();pushIvenaCloud();render("ivena");
}
function editIvena(id){
 const h=db.ivena.find(x=>String(x.id)===String(id));if(!h)return;
 const note=prompt("Übungshinweis / Kapazität / Besonderheiten",h.note||"");
 if(note===null)return;
 h.note=note;save();pushIvenaCloud();render("ivena");
}
function addIvena(){
 const name=prompt("Zielklinik / Einrichtung");if(!name)return;
 const place=prompt("Ort","");
 const area=prompt("Leitstellenbereich (Wilhelmshaven / Oldenburg / Wittmund / …)","Wilhelmshaven");
 db.ivena.push({id:Date.now(),name,place,area:area||"Sonstige",status:"grün",note:"Übungsstatus – manuell pflegen"});
 save();pushIvenaCloud();render("ivena");
}
function toggleIvenaArea(a){
 if(db.ivenaAreaFilter.includes(a)) db.ivenaAreaFilter=db.ivenaAreaFilter.filter(x=>x!==a);
 else db.ivenaAreaFilter=[...db.ivenaAreaFilter,a];
 save();render("ivena");
}
function deleteIvena(id){
 if(!confirm("Eintrag aus der IVENA-Übungsansicht löschen?"))return;
 db.ivena=db.ivena.filter(x=>String(x.id)!==String(id));save();pushIvenaCloud();render("ivena");
}
function toggleIvenaMode(){
 db.ivenaMode=db.ivenaMode==="auto"?"manual":"auto";
 save();render("ivena");
}
function ivenaActiveClosures(h){
 const now=Date.now();
 return (h.closures||[]).filter(cl=>new Date(cl.until).getTime()>now);
}
function openIvenaClosure(hid){
 const h=db.ivena.find(x=>String(x.id)===String(hid));if(!h)return;
 document.getElementById("app").innerHTML=`<div class="card">
  <h2>🚫 Fachrichtung abmelden</h2>
  <p class="muted">${esc(h.name)} · ${esc(h.place||"")}</p>
  <label>Fachrichtung</label>
  <select id="closureFach">${IVENA_FACHRICHTUNGEN.map(f=>`<option value="${esc(f)}">${esc(f)}</option>`).join("")}</select>
  <label style="margin-top:10px">Abgemeldet bis</label>
  <input id="closureUntil" type="datetime-local">
  <div class="row" style="margin-top:14px">
   <button onclick="render('ivena')">Abbrechen</button>
   <button class="primary" onclick="saveIvenaClosure('${hid}')">✅ Abmelden speichern</button>
  </div>
 </div>`;
 const dt=new Date(Date.now()+2*3600*1000);
 const iso=new Date(dt.getTime()-dt.getTimezoneOffset()*60000).toISOString().slice(0,16);
 document.getElementById("closureUntil").value=iso;
}
function saveIvenaClosure(hid){
 const h=db.ivena.find(x=>String(x.id)===String(hid));if(!h)return;
 const fach=document.getElementById("closureFach")?.value;
 const untilRaw=document.getElementById("closureUntil")?.value;
 if(!fach||!untilRaw){toast("Bitte Fachrichtung und Zeitpunkt wählen");return}
 h.closures=h.closures||[];
 h.closures.push({id:Date.now(),fach,until:new Date(untilRaw).toISOString()});
 save();pushIvenaCloud();toast("Fachrichtung abgemeldet");render("ivena");
}
function deleteIvenaClosure(hid,cid){
 const h=db.ivena.find(x=>String(x.id)===String(hid));if(!h)return;
 h.closures=(h.closures||[]).filter(c=>String(c.id)!==String(cid));
 save();pushIvenaCloud();render("ivena");
}
function randomizeIvenaClosures(){
 const now=Date.now();
 db.ivena.forEach(h=>{
   h.closures=ivenaActiveClosures(h);
   if(Math.random()<0.4){
     const fach=IVENA_FACHRICHTUNGEN[Math.floor(Math.random()*IVENA_FACHRICHTUNGEN.length)];
     const hours=1+Math.floor(Math.random()*7);
     h.closures.push({id:Date.now()+Math.random(),fach,until:new Date(now+hours*3600*1000).toISOString()});
   }
 });
 save();pushIvenaCloud();toast("Zufällige Abmeldungen gewürfelt");render("ivena");
}
function assignableTransportUnits(){
 return db.units.filter(u=>["RTW","RTH"].includes(u.type) && String(u.status)==="4");
}
function assignableNefUnits(){
 return db.units.filter(u=>["NEF","RTH"].includes(u.type) && String(u.status)==="4");
}
function toggleAsgNefField(){
 const na=document.getElementById("asgNA")?.value;
 const wrap=document.getElementById("asgNefWrap");
 if(wrap) wrap.classList.toggle("hidden", na!=="ja");
}
function openIvenaAssignment(){
 const hospitals=db.ivena;
 const transportUnits=assignableTransportUnits();
 const nefUnits=assignableNefUnits();
 if(!hospitals.length){toast("Bitte zuerst eine Klinik unter IVENA anlegen");return}
 if(!transportUnits.length){toast("Kein RTW/RTH in Status 4 (Am Einsatzort) verfügbar");return}
 const dt=new Date(Date.now()+20*60*1000);
 const iso=new Date(dt.getTime()-dt.getTimezoneOffset()*60000).toISOString().slice(0,16);
 document.getElementById("app").innerHTML=`<div class="card">
  <h2>🚑🏥 Neue IVENA-Zuweisung</h2>
  <p class="muted">Nur Fahrzeuge in Status 4 (Am Einsatzort) können zugewiesen werden. Sie wechseln danach direkt auf Status 7 und nach ca. 20 Minuten automatisch auf Status 8.</p>
  <label>Zielklinik</label>
  <select id="asgHospital">${hospitals.map(h=>`<option value="${h.id}">${esc(h.name)}${h.place?` (${esc(h.place)})`:""}</option>`).join("")}</select>
  <div class="formgrid">
   <div><label>Fachrichtung</label><select id="asgFach">${IVENA_FACHRICHTUNGEN.map(f=>`<option value="${esc(f)}">${esc(f)}</option>`).join("")}</select></div>
   <div><label>Schockraum</label><select id="asgSchock"><option value="nein">S- (nein)</option><option value="ja">S+ (ja)</option></select></div>
   <div><label>Geschlecht</label><select id="asgGender"><option value="M">M</option><option value="W">W</option></select></div>
   <div><label>Alter</label><input id="asgAlter" type="number" min="0" max="120" placeholder="Jahre"></div>
   <div><label>Notarzt</label><select id="asgNA" onchange="toggleAsgNefField()"><option value="nein">NA- (ohne)</option><option value="ja">NA+ (mit)</option></select></div>
   <div><label>Transportmittel (Status 4)</label><select id="asgTransport">${transportUnits.map(u=>`<option value="${u.id}">${esc(u.opta||u.name)} · ${esc(u.type)}${u.location?` (${esc(u.location)})`:""}</option>`).join("")}</select></div>
  </div>
  <div id="asgNefWrap" class="hidden">
   <label style="margin-top:10px">Begleitendes NEF/RTH (optional, Status 4)</label>
   <select id="asgNef"><option value="">– kein separates Begleitfahrzeug –</option>${nefUnits.map(u=>`<option value="${u.id}">${esc(u.opta||u.name)} · ${esc(u.type)}${u.location?` (${esc(u.location)})`:""}</option>`).join("")}</select>
  </div>
  <label style="margin-top:10px">Voraussichtliche Eintreffzeit</label>
  <input id="asgEta" type="datetime-local" value="${iso}">
  <div class="row" style="margin-top:14px">
   <button onclick="render('ivenaZuweisungen')">Abbrechen</button>
   <button class="primary" onclick="saveIvenaAssignment()">✅ Zuweisen</button>
  </div>
 </div>`;
}
function saveIvenaAssignment(){
 const hospital=db.ivena.find(h=>String(h.id)===String(document.getElementById("asgHospital")?.value));
 const fach=document.getElementById("asgFach")?.value;
 const schockraum=document.getElementById("asgSchock")?.value==="ja";
 const geschlecht=document.getElementById("asgGender")?.value;
 const alter=document.getElementById("asgAlter")?.value;
 const na=document.getElementById("asgNA")?.value==="ja";
 const transport=db.units.find(u=>String(u.id)===String(document.getElementById("asgTransport")?.value));
 const nefId=document.getElementById("asgNef")?.value;
 if(!hospital||!transport){toast("Bitte Klinik und Transportmittel wählen");return}
 if(String(transport.status)!=="4"){toast("Transportmittel ist nicht mehr in Status 4");render("ivenaZuweisungen");return}
 let companion=null;
 if(na && nefId){
   const c=db.units.find(u=>String(u.id)===String(nefId));
   if(c && String(c.id)!==String(transport.id)){
     if(String(c.status)!=="4"){toast("Begleitfahrzeug ist nicht mehr in Status 4");render("ivenaZuweisungen");return}
     companion=c;
   }
 }
 const etaRaw=document.getElementById("asgEta")?.value;
 const vehicles=companion?[transport,companion]:[transport];
 vehicles.forEach(u=>setUnitStatus(u,"7"));
 db.ivenaAssignments=db.ivenaAssignments||[];
 const assignment={
   id:Date.now(),
   hospitalId:hospital.id, hospitalName:hospital.name,
   fach, schockraum, geschlecht, alter, na,
   vehicleIds:vehicles.map(u=>u.id),
   vehicleLabels:vehicles.map(u=>`${u.opta||u.name} (${u.type})`),
   eta: etaRaw?new Date(etaRaw).toISOString():null,
   createdAt:new Date().toISOString(),
   source:"leitstelle"
 };
 db.ivenaAssignments.unshift(assignment);
 save();
 if(db.cloud?.enabled) cloudRequest(`ivenaAssignments/${encodeURIComponent(String(assignment.id))}`,"PUT",assignment);
 toast("Zuweisung gespeichert – Fahrzeug(e) auf Status 7 gesetzt");
 render("ivenaZuweisungen");
}
function deleteIvenaAssignment(id){
 if(!confirm("Zuweisung aus der Liste entfernen? (Fahrzeugstatus bleibt unverändert)"))return;
 db.ivenaAssignments=(db.ivenaAssignments||[]).filter(a=>String(a.id)!==String(id));
 save();render("ivenaZuweisungen");
}
function ivenaZuweisungen(){
 const list=db.ivenaAssignments||[];
 document.getElementById("app").innerHTML=`<div class="card">
  <div class="row between"><div><h2>📋 IVENA-Zuweisungen</h2><p class="muted">Simulierte Patiententransporte: Fahrzeug(e) → Zielklinik. Rein trainingsintern, keine Verbindung zum realen IVENA.</p></div><button class="primary" onclick="openIvenaAssignment()">➕ Neue Zuweisung</button></div>
  <div style="overflow:auto"><table><thead><tr>
   <th>OPTA / Fahrzeug</th><th>Zielklinik</th><th>Fachrichtung</th><th>S</th><th>NA</th><th>Geschlecht/Alter</th><th>Eintreffzeit</th><th></th>
  </tr></thead><tbody>
   ${list.length?list.map(a=>{
     const hospital=db.ivena.find(h=>String(h.id)===String(a.hospitalId));
     const closed=hospital?ivenaActiveClosures(hospital).some(cl=>cl.fach===a.fach):false;
     const etaTxt=a.eta?new Date(a.eta).toLocaleString("de-DE",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"–";
     return `<tr>
      <td>${a.vehicleLabels.map(l=>`<div>${esc(l)}</div>`).join("")}</td>
      <td>${esc(a.hospitalName)}</td>
      <td><span class="status ${closed?"s6":"s2"}">${esc(a.fach)}${closed?" · abgemeldet!":" · frei"}</span></td>
      <td>${a.schockraum?"S+":"S-"}</td>
      <td>${a.na?"NA+":"NA-"}</td>
      <td>${esc(a.geschlecht||"–")} / ${esc(a.alter||"–")}</td>
      <td>${etaTxt}</td>
      <td><button onclick="deleteIvenaAssignment(${a.id})">🗑️</button></td>
     </tr>`;
   }).join(""):`<tr><td colspan="8" class="muted">Noch keine Zuweisungen.</td></tr>`}
  </tbody></table></div>
 </div>`;
}
function ivena(){
 const areas=[...new Set(db.ivena.map(h=>h.area||"Sonstige"))];
 const rows=db.ivena.filter(h=>db.ivenaAreaFilter.includes(h.area||"Sonstige"));
 const isAuto=db.ivenaMode==="auto";
 document.getElementById("app").innerHTML=`<div class="card">
  <div class="row between"><div><h2>🏥 IVENA – Übungsansicht</h2><p class="muted">Lokale Simulation für die Ausbildung. Keine Verbindung zum realen IVENA-System und keine Echtzeit-Kapazitätsdaten.</p></div><button class="primary" onclick="addIvena()">＋ Ziel hinzufügen</button></div>
  <label style="margin-top:4px">Leitstellenbereiche</label>
  <div class="row">${areas.map(a=>`<button class="${db.ivenaAreaFilter.includes(a)?"primary":""}" onclick="toggleIvenaArea('${a.replace(/'/g,"\\'")}')">${db.ivenaAreaFilter.includes(a)?"✅ ":""}${esc(a)}</button>`).join("")}</div>
  <div class="row between" style="margin-top:14px;background:#f8fafc;border-radius:10px;padding:10px 12px">
   <div><b>Fachrichtungs-Abmeldungen:</b> <span class="muted">${isAuto?"Werden zufällig gewürfelt.":"Werden manuell pro Klinik gepflegt."}</span></div>
   <div class="row">
    <button class="${isAuto?"":"primary"}" onclick="${isAuto?"toggleIvenaMode()":""}">🖐️ Manuell</button>
    <button class="${isAuto?"primary":""}" onclick="${isAuto?"":"toggleIvenaMode()"}">🎲 Automatisch</button>
    ${isAuto?`<button onclick="randomizeIvenaClosures()">🎲 Neu auswürfeln</button>`:""}
   </div>
  </div>
  <div style="overflow:auto;margin-top:10px"><table><thead><tr><th>Ziel</th><th>Ort</th><th>Bereich</th><th>Übungsstatus</th><th>Abgemeldete Fachrichtungen</th><th>Hinweis</th><th>Aktionen</th></tr></thead><tbody>
   ${rows.map(h=>{
     const closures=ivenaActiveClosures(h);
     return `<tr>
    <td><b>${esc(h.name)}</b></td><td>${esc(h.place||"—")}</td><td>${esc(h.area||"—")}</td>
    <td><span class="status ${ivenaStatusClass(h.status)}">${esc(h.status.toUpperCase())}</span></td>
    <td>
     ${closures.length?closures.map(cl=>`<div class="pill" style="margin:2px 0;display:inline-flex;gap:6px;align-items:center">🚫 ${esc(cl.fach)} bis ${new Date(cl.until).toLocaleString("de-DE",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})} <span style="cursor:pointer" onclick="deleteIvenaClosure(${h.id},'${cl.id}')">✕</span></div><br>`).join(""):`<span class="muted">keine</span>`}
     ${!isAuto?`<div><button onclick="openIvenaClosure(${h.id})">🚫 Fachrichtung abmelden</button></div>`:""}
    </td>
    <td>${esc(h.note||"")}</td>
    <td><div class="row"><button onclick="setIvenaStatus(${h.id},'grün')">🟢</button><button onclick="setIvenaStatus(${h.id},'gelb')">🟡</button><button onclick="setIvenaStatus(${h.id},'rot')">🔴</button><button onclick="editIvena(${h.id})">✏️</button><button onclick="deleteIvena(${h.id})">🗑️</button></div></td>
   </tr>`;
   }).join("")}
  </tbody></table></div>
  <div class="card" style="margin-top:12px;background:#f8fafc"><b>Für Übungen gedacht:</b> Grün/Gelb/Rot, Fachrichtungs-Abmeldungen und Hinweise können von der Übungsleitung frei gesetzt werden, z. B. „CT belegt“, „Schockraum frei“ oder „keine pädiatrische Aufnahme“.</div>
 </div>`;
}

setInterval(()=>{const clock=document.getElementById("clock");if(clock)clock.textContent=new Date().toLocaleTimeString("de-DE");applyDutySchedule();autoReturnToStation();autoPatientHandover()},1000);
if(!initVehicleMode()){
 render("leitstelle");
 if(db.cloud?.enabled) startCloudPolling();
}
</script>
</body></html>
