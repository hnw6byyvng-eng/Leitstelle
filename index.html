:root{--bg:#eef2f6;--panel:#fff;--ink:#17202a;--muted:#66717d;--line:#d9e0e7;--nav:#0b1220;--accent:#e30613;--green:#198754;--yellow:#e0a800;--red:#c82333;--blue:#1976d2}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
header{height:64px;background:var(--nav);color:white;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:10}
.brand{font-weight:800;letter-spacing:.3px}.clock{font-variant-numeric:tabular-nums;color:#cbd5e1}
nav{display:flex;gap:6px;background:#111827;padding:8px;overflow:auto;position:sticky;top:64px;z-index:9}
nav button{border:0;background:#243044;color:#dbe4ef;border-radius:9px;padding:11px 14px;font-weight:700;white-space:nowrap}
nav button.active{background:#e30613;color:white}
main{max-width:1250px;margin:0 auto;padding:16px}
.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:16px}@media(max-width:850px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 2px 8px #0000000a;margin-bottom:14px}
h1,h2,h3{margin:0 0 12px} h2{font-size:20px} h3{font-size:16px}
.muted{color:var(--muted)} .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
button,.btn{border:1px solid var(--line);background:#f8fafc;color:var(--ink);border-radius:9px;padding:10px 13px;font-weight:700;cursor:pointer}
button.primary{background:#e30613;color:#fff;border-color:#e30613}.btn.green{background:#e9f7ef;color:#12633b}.btn.blue{background:#eaf2ff;color:#1456a0}
input,select,textarea{width:100%;border:1px solid #cbd5df;border-radius:9px;padding:11px;background:#fff;font:inherit}
label{font-size:13px;font-weight:700;color:#4b5563;display:block;margin:8px 0 5px}
.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(max-width:600px){.formgrid{grid-template-columns:1fr}}
.status{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800}
@keyframes status0blink{0%,45%{background:#d71920;color:#fff;box-shadow:0 0 0 0 rgba(215,25,32,.55)}50%,95%{background:#fff;color:#d71920;box-shadow:0 0 0 4px rgba(215,25,32,.18)}100%{background:#d71920;color:#fff}}
.s0{background:#d71920;color:#fff;animation:status0blink 1s steps(1,end) infinite;border:2px solid #d71920}.s1{background:#b9f6ca;color:#0b5d2a}.s2{background:#1f7a3f;color:#fff}.s3{background:#ffe082;color:#6b5200}.s4{background:#ffb74d;color:#6b3600}.s5{background:#fff;color:#333;border:1px solid #cbd5df}.s6{background:#e53935;color:#fff}.s7{background:#b3e5fc;color:#075985}.s8{background:#1565c0;color:#fff}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}th{font-size:12px;color:#66717d;text-transform:uppercase}
.call{border-left:5px solid #e30613}.big{font-size:28px;font-weight:900}.suggest{background:#fff8e1;border:1px solid #f1d37a;border-radius:10px;padding:12px}
.answer{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.answer button{text-align:left;background:#f8fafc}@media(max-width:600px){.answer{grid-template-columns:1fr}}
.hidden{display:none!important}.pill{padding:4px 8px;border-radius:999px;background:#eef2f6;font-size:12px;font-weight:800}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 15px;border-radius:10px;display:none;z-index:30}

#map{height:62vh;min-height:430px;border-radius:12px;border:1px solid var(--line);overflow:hidden}
.mapSearch{display:grid;grid-template-columns:1fr auto;gap:8px}
.mapResult{padding:9px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.mapResult:hover{background:#f4f7fa}
.coords{font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--muted)}

</style>
</head>

      <div class="card">

        <p class="muted">Kartendarstellung über OpenStreetMap. Für Karte und Adresssuche wird eine Internetverbindung benötigt.</p>

    </aside>
  </div>`;
  setTimeout(initMap,0);

function initMap(){
  if(typeof L==="undefined"){
    document.getElementById("map").innerHTML='<div style="padding:20px">Kartenbibliothek konnte nicht geladen werden. Internetverbindung prüfen.</div>';
    return;
  }
  const c=db.currentCall;
  const lat=Number(c?.lat)||53.3965, lng=Number(c?.lng)||8.1364; // Varel
  leafletMap=L.map("map").setView([lat,lng], c?.lat?16:11);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
    maxZoom:19,
    attribution:'&copy; OpenStreetMap-Mitwirkende'
  }).addTo(leafletMap);

  if(c?.lat&&c?.lng) setIncidentMarker(Number(c.lat),Number(c.lng),false);

  leafletMap.on("click", async e=>{
    setIncidentMarker(e.latlng.lat,e.latlng.lng,true);
    await reverseGeocode(e.latlng.lat,e.latlng.lng);
  });
  setTimeout(()=>leafletMap.invalidateSize(),150);
}

function setIncidentMarker(lat,lng,updateSelection=true){
  if(!leafletMap)return;
  if(incidentMarker) leafletMap.removeLayer(incidentMarker);
  incidentMarker=L.marker([lat,lng],{draggable:true}).addTo(leafletMap);
  incidentMarker.bindPopup("📍 Notfallort").openPopup();
  if(updateSelection){

async function reverseGeocode(lat,lng){
  try{
    const url=`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}`;
    const res=await fetch(url,{headers:{"Accept":"application/json"}});
    const r=await res.json();
    const address=r.display_name||`${lat.toFixed(6)}, ${lng.toFixed(6)}`;
    selectedMapLocation={lat,lng,address};
    document.getElementById("mapAddress").value=address;
  }catch(e){
    selectedMapLocation={lat,lng,address:`${lat.toFixed(6)}, ${lng.toFixed(6)}`};
  }
}

function setUnitStatus(u,status){
 u.status=String(status);
 if(String(status)==="1"){
   u.status1Since=Date.now();
   // random return-to-station delay, always <= 10 minutes
   u.status2Due=Date.now()+Math.floor((2+Math.random()*8)*60*1000);
 }else{
   delete u.status1Since;
   delete u.status2Due;
 }
}
function autoReturnToStation(){
 const now=Date.now();
 let changed=false;
 db.units.forEach(u=>{
   if(u.status==="1"){
     if(!u.status2Due){
       u.status1Since=now;
       u.status2Due=now+Math.floor((2+Math.random()*8)*60*1000);
       changed=true;
     }else if(now>=u.status2Due){
       u.status="2";
       delete u.status1Since; delete u.status2Due;
       changed=true;
     }
   }
 });
 if(changed)save();
}

const OPTA_AREA_ORDER={
 "1":"Jever",
 "2":"Varel",
 "3":"Zetel",
 "4":"Sande",
 "5":"Schortens",
 "6":"Wangerland",
 "7":"Bockhorn"
};
function optaAreaDigit(u){
 const s=String(u.name||u.opta||"").replace(/[^\d]/g,"");
 // Friesland tactical IDs in this simulator use the second digit of the numeric OPTA block.
 return s.length>=2?s[1]:"9";
}
function optaAreaName(u){
 return OPTA_AREA_ORDER[optaAreaDigit(u)]||u.location||"Sonstige";
}
function geoSortUnits(arr){
 return [...arr].sort((a,b)=>{
   const da=Number(optaAreaDigit(a)), db=Number(optaAreaDigit(b));
   if(da!==db)return da-db;
   return String(a.name).localeCompare(String(b.name),"de",{numeric:true});
 });
}
function syncLocationFromOpta(){
 db.units.forEach(u=>{
   if(["Feuerwehr","Rettungsdienst"].includes(u.org)){
     const area=OPTA_AREA_ORDER[optaAreaDigit(u)];
     if(area)u.location=area;
   }
 });
}


const AREA_CENTERS={
 "Jever":[53.5737,7.8996],
 "Varel":[53.3969,8.1362],
 "Zetel":[53.4167,7.9833],
 "Sande":[53.5044,8.0147],
 "Schortens":[53.5333,7.9500],
 "Wangerland":[53.6570,7.9200],
 "Bockhorn":[53.3970,8.0200]
};
function haversine(lat1,lon1,lat2,lon2){
 const R=6371,toRad=x=>x*Math.PI/180;
 const dLat=toRad(lat2-lat1),dLon=toRad(lon2-lon1);
 const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
 return 2*R*Math.asin(Math.sqrt(a));
}
function incidentPoint(){
 const c=db.currentCall||{};
 const lat=Number(c.lat??c.latitude), lon=Number(c.lng??c.lon??c.longitude);
 if(Number.isFinite(lat)&&Number.isFinite(lon))return [lat,lon];
 const txt=((c.location||"")+" "+(c.geocodedAddress||"")+" "+(c.answers?.location||"")).toLowerCase();
 for(const [area,pt] of Object.entries(AREA_CENTERS)){
   if(txt.includes(area.toLowerCase()))return pt;
 }
 return null;
}
function incidentArea(){
 const p=incidentPoint();
 if(!p)return null;
 return Object.entries(AREA_CENTERS).sort((a,b)=>
   haversine(p[0],p[1],a[1][0],a[1][1])-haversine(p[0],p[1],b[1][0],b[1][1])
 )[0][0];
}
function unitPoint(u){
 const a=optaAreaName(u);
 if(AREA_CENTERS[a])return AREA_CENTERS[a];
 const loc=String(u.location||"").toLowerCase();
 for(const [area,pt] of Object.entries(AREA_CENTERS))
   if(loc.includes(area.toLowerCase()))return pt;
 return null;
}
function geographicRank(u){
 const target=incidentPoint(), home=unitPoint(u);
 if(target&&home)return haversine(target[0],target[1],home[0],home[1]);
 const area=incidentArea();
 if(area&&optaAreaName(u)===area)return 0;
 return 999;
}
function nearestFirst(arr){
 return [...arr].sort((a,b)=>{
   const ga=geographicRank(a),gb=geographicRank(b);
   if(ga!==gb)return ga-gb;
   // status 1/2 preference remains, but geography wins first
   const sa=a.status==="1"?0:a.status==="2"?1:2;
   const sb=b.status==="1"?0:b.status==="2"?1:2;
   if(sa!==sb)return sa-sb;
   return String(a.name).localeCompare(String(b.name),"de",{numeric:true});
 });
}

function availableUnits(type,org=null){
 const prim=nearestFirst(db.units.filter(u=>(!type||u.type===type)&&(!org||u.org===org)&&["1","2"].includes(u.status)));
 if(prim.length)return prim;
 return nearestFirst(db.units.filter(u=>(!type||u.type===type)&&(!org||u.org===org)&&u.status==="8"));
}
function chooseOne(type,org=null){return availableUnits(type,org)[0]||null}


function realisticMode(){
  applyDutySchedule();
  const candidates=db.units.filter(u=>["Feuerwehr","Rettungsdienst"].includes(u.org) && !u.schedule && !["0","3","4","5","6","7"].includes(u.status));
  // reset eligible units to plausible base state first
  candidates.forEach(u=>u.status=(u.org==="Feuerwehr"?"2":"1"));
  // random subset gets realistic non-free states
  const shuffled=[...candidates].sort(()=>Math.random()-.5);
  const n=Math.max(3,Math.min(10,Math.floor(shuffled.length*0.18)));
  shuffled.slice(0,n).forEach((u,i)=>{
    const states=["3","4","6","8"];
    u.status=states[i%states.length];
  });
  // air rescue can also be occasionally unavailable/mission-bound, but keep less frequent
  const c26=db.units.find(u=>u.name==="Christoph 26");
  if(c26 && Math.random()<0.35) c26.status=Math.random()<0.7?"3":"8";
  save(); toast("Realistischer Statusmix gesetzt"); render("mittel");
}

function extraResources(){
  const c=db.currentCall;
  if(!c){toast("Kein laufender Einsatz");return}
  const opts=db.units.filter(u=>["1","2","8"].includes(u.status));
  if(!opts.length){toast("Keine verfügbaren Mittel");return}
  const types=[...new Set(opts.map(u=>u.type))].sort();
  const type=prompt("Zusätzliches Rettungsmittel / Fahrzeugtyp:\n"+types.join(", "));
  if(!type)return;
  const matches=opts.filter(u=>u.type.toLowerCase()===type.trim().toLowerCase());
  if(!matches.length){toast("Kein passendes verfügbares Mittel");return}
  const chosen=matches[0];
  c.proposedUnitIds=c.proposedUnitIds||[];
  if(!c.proposedUnitIds.includes(chosen.id))c.proposedUnitIds.push(chosen.id);
  c.proposal=c.proposal||[];
  if(!c.proposal.some(x=>x.id===chosen.id))c.proposal.push(chosen);
  c.suggestion=(c.suggestion?c.suggestion+" · ":"")+`${chosen.opta||chosen.name} – ${chosen.type} (zusätzlich)`;
  c.history.push({q:"➕ Zusätzliches Rettungsmittel",a:`${chosen.opta||chosen.name} – ${chosen.type}`});
  save(); toast("Zusätzliches Mittel ergänzt"); render("leitstelle");
}

 if(type==="xbreathing") return `<label>${label}</label><div class="answer">
   <button onclick="answer('${id}','Normal')">Normal</button>
   <button onclick="answer('${id}','Auffällig')">Auffällig</button>
   <button onclick="answer('${id}','Keine normale Atmung')">Keine normale Atmung</button>
   <button onclick="answer('${id}','Unklar')">Unklar</button></div>`;
 if(type==="xcirc") return `<label>${label}</label><div class="answer">

 if(type==="xdisability") return `<label>${label}</label><div class="answer">

 return `<label>${label}</label><div class="answer"><button onclick="answer('${id}','ja')">Ja</button><button onclick="answer('${id}','nein')">Nein</button><button onclick="answer('${id}','unbekannt')">Unbekannt</button></div>`;

async function geocodeIncidentAddress(address){
 if(!address || address.trim().length<3)return false;
 try{
   const q=encodeURIComponent(address.includes("Friesland")?address:`${address}, Landkreis Friesland, Niedersachsen, Deutschland`);
   const res=await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=de&q=${q}`,{headers:{"Accept":"application/json"}});
   const rows=await res.json();
   if(rows&&rows[0]){
     const c=db.currentCall;
     c.lat=Number(rows[0].lat); c.lng=Number(rows[0].lon);
     c.geocodedAddress=rows[0].display_name||address;
     return true;
   }
 }catch(e){}
 return false;
}

async function answer(k,v){
 const c=db.currentCall;
 c.answers[k]=v;
 if(k==="location"){
   c.location=v;
   await geocodeIncidentAddress(v);
 }
 if(k==="count")c.count=v;
 const q=qs.find(x=>x[0]===k);
 c.history.push({q:q?q[1]:k,a:v});
 evaluate();
 save();
 notruf();
}
function evaluate(){
 applyDutySchedule();
 const c=db.currentCall, a=c.answers, e=a.event||"";
 let req=[], keyword="Noch unklar", sr=true;

 const add=(type,n=1,org=null)=>{for(let i=0;i<n;i++)req.push({type,org})};

 if(e==="Reanimation" || (a.conscious==="nein" && a.breathing==="nein")){
   keyword="REANIMATION R1N1";
   add("RTW",1,"Rettungsdienst"); add("NEF",1,"Rettungsdienst");
   const nktw=availableUnits("NKTW","Rettungsdienst")[0];
   if(nktw) req.push({exact:nktw.id,type:"NKTW",org:"Rettungsdienst",firstResponder:true});
 } else if(e==="Person im Wasser"){
   keyword="H_Person im Wasser R1";
   add("GW Wasserrettung",1,"DLRG"); add("MTW",1,"DLRG"); add("GW Drohne",1,"DLRG");
   add("HLF",1,"Feuerwehr"); add("RTW",1,"Rettungsdienst"); add("FuStW",1,"Polizei");
 } else if(e==="Tier im Wasser"){
   keyword="H_Tier im Wasser R1";
   add("GW Wasserrettung",1,"DLRG"); add("MTW",1,"DLRG"); add("GW Drohne",1,"DLRG");
   add("HLF",1,"Feuerwehr"); add("RTW",1,"Rettungsdienst"); add("FuStW",1,"Polizei");
 } else if(e==="Boot in Notlage"){
   const cnt=Number(a.count)||1;
   keyword=cnt>=2?"H_Boot YY R1":"H_Boot Y R1";
   add("GW Wasserrettung",1,"DLRG"); add("MTW",1,"DLRG"); add("GW Drohne",1,"DLRG");
   add("HLF",1,"Feuerwehr"); add("RTW",Math.max(1,Math.min(cnt,3)),"Rettungsdienst"); add("FuStW",1,"Polizei");
 } else if(e==="Feuer / Rauchentwicklung"){
   keyword=a.firePeople==="ja"?"F_2_Y":"F_2";
   add("HLF",1,"Feuerwehr"); add("LF",1,"Feuerwehr");
   if(a.firePeople==="ja"){add("DLK",1,"Feuerwehr");add("RTW",1,"Rettungsdienst")}
 } else if(e==="Verkehrsunfall"){
   keyword=a.trapped==="ja"?"H_Eingeklemmt_2 R1":"H_VU R1";
   add("HLF",1,"Feuerwehr"); add("RTW",1,"Rettungsdienst");
   if(a.trapped==="ja")add("RW",1,"Feuerwehr");
 } else if(e==="Technische Hilfeleistung"){
   keyword="TH";
   add("HLF",1,"Feuerwehr");
 } else if(e==="Medizinischer Notfall"){
   keyword="MEDIZINISCHER NOTFALL R1";
   add("RTW",1,"Rettungsdienst");
 } else if(e==="Sonstiger Notfall"){
   keyword="NOTFALL – Disponentenentscheidung";
   sr=false;
 }

 let selected=[], used=new Set();
 for(const r of req){
   let u=null;
   if(r.exact)u=db.units.find(x=>x.id===r.exact);
   else {
     let arr=availableUnits(r.type,r.org).filter(x=>!used.has(x.id));
     u=arr[0]||null;
   }
   if(u){selected.push({...u,firstResponder:!!r.firstResponder});used.add(u.id)}
   else selected.push({missing:true,type:r.type,org:r.org});
 }
 c.keyword=keyword;
 c.proposedUnitIds=selected.filter(x=>!x.missing).map(x=>x.id);
 c.proposal=selected;
 c.suggestion=selected.map(x=>x.missing?`⚠️ ${x.type} (${x.org||"beliebig"}) nicht verfügbar`:`${x.opta||x.name} – ${x.type}${x.firstResponder?" (First Responder)":""}${Number.isFinite(geographicRank(x))&&geographicRank(x)<999?` (~${geographicRank(x).toFixed(1)} km Luftlinie)`:``}`).join(" · ");
 c.sr=sr;
}

function buildMeldertext(c, nafoReason=""){
  const ort=c.location||c.answers?.location||"Ort unbekannt";
  const lage=c.answers?.event||c.keyword||"Einsatz";
  const mittel=(c.suggestion||"").replace(/<[^>]*>/g,"");
  let txt=`${c.keyword||"EINSATZ"}\nOrt: ${ort}\nMeldung: ${lage}`;
  if(c.answers?.freeText)txt+=`\nNotruf-Freitext: ${c.answers.freeText}`;
  if(needsXABCDE(c)){
    txt+=`\nXABCDE: X ${c.answers.x_massive}; A ${c.answers.a_airway}; B ${c.answers.b_breath}; C ${c.answers.c_circ}; D ${c.answers.d_disability}; E ${c.answers.e_exposure}`;
  }
  if(c.alarmFreeText)txt+=`\nAlarmierungs-Freitext: ${c.alarmFreeText}`;
  if(mittel) txt+=`\nWeitere Rettungsmittel: ${mittel}`;
  txt+=`\nAnfahrt: entsprechend AAO`;
  if(nafoReason) txt+=`\nNAFO-Grund: ${nafoReason}`;
  return txt;
}
function openNafo(){
  const c=db.currentCall;
  if(!c){toast("Kein laufender Einsatz");return}
  const grund=prompt("NAFO-Grund / Nachforderungsgrund:");
  if(!grund)return;
  const text=buildMeldertext(c,grund);
  if(!c.nafo)c.nafo=[];
  c.nafo.push({time:new Date().toISOString(),reason:grund,text});
  save();
  showNafo(text);
}
function showNafo(text){
  document.getElementById("app").innerHTML=`<div class="card call">
    <div class="row between"><div><h2>📟 NAFO / Nachforderung</h2><div class="muted">Übungs-Meldertext</div></div><button onclick="render('leitstelle')">Zurück</button></div>

function prepareAlarm(){
 const c=db.currentCall;
 if(!c||!c.proposedUnitIds||!c.proposedUnitIds.length){toast("Kein alarmierbarer Vorschlag vorhanden");return}
 if(needsXABCDE(c)&&!xabcdeComplete(c)){
   toast("Vor Alarmierung muss XABCDE vollständig abgefragt werden");
   render("notruf");
   return;
 }
 const xtext=needsXABCDE(c)?[
   `X: ${c.answers.x_massive}`,
   `A: ${c.answers.a_airway}`,
   `B: ${c.answers.b_breath}`,
   `C: ${c.answers.c_circ}`,
   `D: ${c.answers.d_disability}`,
   `E: ${c.answers.e_exposure}`
 ].join("\n"):"";
 document.getElementById("app").innerHTML=`<div class="card call">
   <div class="row between"><div><h2>🚨 Alarmierung vorbereiten</h2><div class="muted">Noch keine Alarmierung – Angaben prüfen und ergänzen.</div></div><button onclick="render('leitstelle')">Abbrechen</button></div>
   <label>Einsatzstichwort</label><div class="big">${esc(c.keyword||"—")}</div>
   <label style="margin-top:12px">Vorgeschlagene Einsatzmittel</label>
   <div class="suggest">${esc(c.suggestion||"—")}</div>
   ${xtext?`<label style="margin-top:12px">XABCDE</label><pre style="white-space:pre-wrap;background:#f8fafc;padding:10px;border-radius:10px">${esc(xtext)}</pre>`:""}
   <label style="margin-top:12px">📝 Freitext für die Alarmierung</label>
   <textarea id="alarmFreeText" rows="7" placeholder="Zusätzliche Lageinformationen, Hinweise zur Anfahrt, Gefahren, Zugang, Ansprechpartner …">${esc(c.alarmFreeText||c.answers?.freeText||"")}</textarea>
   <div class="row" style="margin-top:12px">
     <button onclick="render('leitstelle')">Zurück</button>
     <button class="primary" onclick="confirmAlarm()">🚨 Jetzt alarmieren</button>
   </div>
   <p class="muted">Simulation: Es wird keine reale Alarmierung ausgelöst.</p>
 </div>`;
}
function confirmAlarm(){
 const c=db.currentCall;
 if(!c)return;
 c.alarmFreeText=document.getElementById("alarmFreeText")?.value||"";
 alarmProposal();
}
function alarmProposal(){
 const c=db.currentCall;
 if(!c||!c.proposedUnitIds||!c.proposedUnitIds.length){toast("Kein alarmierbarer Vorschlag vorhanden");return}
 if(needsXABCDE(c)&&!xabcdeComplete(c)){
   toast("XABCDE ist noch nicht vollständig");
   render("notruf");
   return;
 }
 const now=new Date();
 c.alarmedUnits=c.alarmedUnits||[];
 for(const id of c.proposedUnitIds){
   const u=db.units.find(x=>x.id===id);
   if(!u)continue;
   setUnitStatus(u,"3");
   if(!c.alarmedUnits.includes(id))c.alarmedUnits.push(id);
 }
 c.alarmTime=now.toISOString();
 c.history.push({q:"🚨 Alarmierung",a:`Vorschlag alarmiert – ${now.toLocaleTimeString("de-DE")}${c.alarmFreeText?` | Freitext: ${c.alarmFreeText}`:""}`});
 save();
 toast("Vorschlag im Simulator alarmiert – weiterer Notruf möglich");
 render("leitstelle");
}

function finishCall(id=null){
 const targetId=String(id ?? db.currentCall?.id ?? "");
 let c=null, source="";
 if(db.currentCall && String(db.currentCall.id)===targetId){c=db.currentCall;source="current";}
 else{
   const i=(db.activeCalls||[]).findIndex(x=>String(x.id)===targetId);
   if(i>=0){c=db.activeCalls[i];source="active";}
 }
 if(!c){toast("Einsatz nicht gefunden");return}

 const ids=new Set([...(c.alarmedUnits||[]),...(c.proposedUnitIds||[])]);
 ids.forEach(uid=>{
   const u=db.units.find(x=>String(x.id)===String(uid));
   if(u)setUnitStatus(u,"1");
 });
 c.endTime=new Date().toISOString();
 db.logs.unshift(c);

 if(source==="current")db.currentCall=null;
 else db.activeCalls=db.activeCalls.filter(x=>String(x.id)!==targetId);

 save();
 toast("Einsatz abgeschlossen – zugeordnete Mittel Status 1");
 render("leitstelle");
}
function addUnit(u={}){const name=prompt("Funkrufname",u.name||"");if(!name)return;const unit={id:Date.now(),name,type:prompt("Fahrzeug-/Einheitentyp",u.type||"RTB"),location:prompt("Standort",u.location||"Varel"),status:u.status||"1",crew:prompt("Besatzung",u.crew||"2"),skills:prompt("Fähigkeiten",u.skills||"Wasserrettung")};db.units.push(unit);save();render("mittel")}
function editUnit(id){let u=db.units.find(x=>x.id===id);if(u){addUnit(u);db.units=db.units.filter(x=>x.id!==id);save()}}
