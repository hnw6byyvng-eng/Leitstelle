 if(!/^\d+$/.test(compact)){ch.innerHTML=`<span class="muted">Suche … Code antippen zum Übernehmen.</span>`;return}
 if(compact.length>=3&&!f){ch.innerHTML=`<span style="color:#d71920">RMI ${esc(compact.slice(0,3))} gibt es in der Liste nicht.</span>`;return}
 if(!f){ch.innerHTML=`<span class="muted">RMI vervollständigen …</span>`;return}
 const fach=pzcFachrichtung(f.code);
 let need="";
 if(compact.length<5)need=`Noch 2 Ziffern Alter eintippen (Säugling = 00).`;
 else if(compact.length<6)need=`Noch Dringlichkeit eintippen: ${f.allowed.split("").join(" / ")}.`;
 else if(!r.dringlichkeit)need=`<span style="color:#d71920">Dringlichkeit ${esc(compact[5])} ist für ${f.code} nicht erlaubt (erlaubt: ${f.allowed.split("").join(" / ")}).</span>`;
 ch.innerHTML=`<b>${f.code} – ${esc(f.label)}</b> <span class="muted">(${esc(f.group)}${fach?` · ${esc(fach)}`:""})</span>`
   +(r.alter!==""?` · Alter <b>${esc(r.alter)}</b>`:"")
   +(r.dringlichkeit?` · Dringlichkeit <b>${esc(PZC_DRINGLICHKEIT[r.dringlichkeit])}</b>`:"")
   +(r.pzc?` · <span style="color:#166534;font-weight:800">✔ PZC ${esc(r.pzc)}</span>`:`<br>${need}`);
}

function saveIvenaAssignment(){
 const hospital=db.ivena.find(h=>String(h.id)===String(document.getElementById("asgHospital")?.value));
 const fach=pzcFachrichtung(document.getElementById("asgRmi")?.value||"");
 const zus=ivenaFlagsRead("asg");
 const schockraum=zus.flags.s, geschlecht=zus.geschlecht, na=zus.flags.n;
 const alter=document.getElementById("asgAlter")?.value??"";
 const transport=db.units.find(u=>String(u.id)===String(document.getElementById("asgTransport")?.value));
 const nefId=document.getElementById("asgNef")?.value;
 if(!hospital||!transport){toast("Bitte Klinik und Transportmittel wählen");return}
 if(String(transport.status)!=="4"){toast("Transportmittel ist nicht mehr in Status 4");render("ivenaZuweisungen");return}
 let companion=null;
 if(na && nefId){
   const c=db.units.find(u=>String(u.id)===String(nefId));
   if(c && String(c.id)!==String(transport.id)){
     if(String(c.status)!=="4"){toast("Begleitfahrzeug ist nicht mehr in Status 4");render("ivenaZuweisungen");return}
     companion=c;
   }
 }
 const eta=etaRead("asg");
 if(!eta){toast("Bitte die Uhrzeit der Eintreffzeit wählen");return}
 const pz=pzcRead("asg");
 const vehicles=companion?[transport,companion]:[transport];
 vehicles.forEach(u=>setUnitStatus(u,"7"));
 db.ivenaAssignments=db.ivenaAssignments||[];
 const assignment={
   id:Date.now(),
   hospitalId:hospital.id, hospitalName:hospital.name,
   fach, schockraum, geschlecht, alter, na,
   rmi:pz.rmi, dringlichkeit:pz.dringlichkeit, pzc:pz.pzc, flags:zus.flags, info:zus.info,
   vehicleIds:vehicles.map(u=>u.id),
   vehicleLabels:vehicles.map(u=>`${u.opta||u.name} (${u.type})`),
   eta,
   createdAt:new Date().toISOString(),
   source:"leitstelle"
 };
 db.ivenaAssignments.unshift(assignment);
 save();
 if(db.cloud?.enabled) cloudRequest(`ivenaAssignments/${encodeURIComponent(String(assignment.id))}`,"PUT",assignment);
 toast("Zuweisung gespeichert – Fahrzeug(e) auf Status 7 gesetzt");
 render("ivenaZuweisungen");
}

// dieselben Fahrzeuge weiterschalten.
setInterval(()=>{const clock=document.getElementById("clock");if(clock)clock.textContent=new Date().toLocaleTimeString("de-DE");if(IS_MONITOR)return;applyDutySchedule();autoReturnToStation();autoAdvanceEnRoute()},1000);
// Läuft der Hauptplatz in einem Hintergrund-Tab oder mit gesperrtem Bildschirm, drosseln Browser
// (v. a. mobil/iOS) genau dieses 1-Sekunden-Intervall stark oder pausieren es ganz – der 07:00/
// 19:00-Dienstplanwechsel (applyDutySchedule) wurde dann teils erst mit großer Verzögerung
// nachgeholt. Zusätzlich zum Intervall wird er deshalb sofort beim Zurückkehren in den
// Vordergrund (visibilitychange/focus) erneut ausgeführt.
if(!isTerminalLink){
 const catchUpDutySchedule=()=>{if(document.visibilityState==="visible"&&!IS_MONITOR){applyDutySchedule();if(["leitstelle","mittel"].includes(currentPage))render(currentPage)}};
 document.addEventListener("visibilitychange",catchUpDutySchedule);
 window.addEventListener("focus",catchUpDutySchedule);
}else{
 const catchUpTerminal=()=>{if(document.visibilityState==="visible"&&terminalRefreshFn)terminalRefreshFn()};
 document.addEventListener("visibilitychange",catchUpTerminal);
 window.addEventListener("focus",catchUpTerminal);
}
if(!initVehicleMode()){
 // Bei jedem (Neu-)Start der Leitstelle gehen alle eigenen Fahrzeuge auf Status 2 (Frei auf
 // Wache) zurück – außer solche, die gerade auf Status 6 (Nicht einsatzbereit) stehen, die
 // bleiben bewusst außer Dienst, bis die Leitstelle sie manuell wieder freigibt.
 // Achtung bei mehreren gleichzeitig verbundenen Geräten (Cloud-Sync aktiv): ein Neuladen der
 // Leitstellen-Seite setzt dann auch Fahrzeuge zurück, deren Besatzung selbst gerade unterwegs
 // ist – das ist bewusst so gewünscht, sollte aber während einer laufenden Übung mit mehreren
 // Geräten beachtet werden.
 if(!IS_MONITOR){
   let resetChanged=false;
   db.units.forEach(u=>{
     if(!["6","2"].includes(String(u.status))){ setUnitStatus(u,u.schedule?"1":"2"); resetChanged=true; }
   });
   // Fahrzeuge mit Dienstzeiten (z. B. Wasserwacht, Northern 06) sofort auf den passenden Status
   db.units.forEach(u=>{if(u.schedule&&String(u.status)==="2"){u.status="1";resetChanged=true}});
   applyDutySchedule();
   if(resetChanged)save();
 }
 render(IS_MONITOR?monitorStartPage:"leitstelle");
 if(db.cloud?.enabled && !IS_MONITOR) startCloudPolling();
 startStateSync();
}
</script>
<script>
if("serviceWorker" in navigator){
  // Neue Version: sobald ein neuer Service Worker die Kontrolle übernimmt, einmal automatisch
  // neu laden, damit Updates ohne mehrfaches Neuladen ankommen.
  let swReloaded=false;
  const hadController=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{
    if(swReloaded||!hadController)return; swReloaded=true; location.reload();
  });
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{});
  });
}
</script>
</body></html>
